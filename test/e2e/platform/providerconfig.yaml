apiVersion: external-secrets.services.open-control-plane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: externalsecretsoperator
spec:
  pollInterval: 10s
  versions:
    - version: "v2.1.0"
      chartVersion: "2.1.0"
      chartURL: oci://ghcr.io/external-secrets/charts/external-secrets
      chartPullSecret: privateregcred
      helmValues:
        namespaceOverride: eso-system
        global:
          repository: ghcr.io/external-secrets/external-secrets
          imagePullSecrets:
            - name: privateregcred
    - version: "latest"
      # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
      chartVersion: "2.10.0"
      chartURL: oci://ghcr.io/external-secrets/charts/external-secrets
      helmValues:
        image:
          repository: ghcr.io/external-secrets/external-secrets
          # -- The image tag to use. The default is the chart appVersion.
          # renovate: datasource=docker depName=external-secrets registryUrl=https://ghcr.io/external-secrets
          tag: "v2.9.0"
        webhook:
          image:
            repository: ghcr.io/external-secrets/external-secrets
            # -- The image tag to use. The default is the chart appVersion.
            # renovate: datasource=docker depName=external-secrets registryUrl=https://ghcr.io/external-secrets
            tag: "v2.9.0"
        certController:
          image:
            repository: ghcr.io/external-secrets/external-secrets
            # -- The image tag to use. The default is the chart appVersion.
            # renovate: datasource=docker depName=external-secrets registryUrl=https://ghcr.io/external-secrets
            tag: "v2.9.0"
